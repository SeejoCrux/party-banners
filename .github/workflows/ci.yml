name: PR Verification

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  pr-check:
    name: PR Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Branch
        run: echo "PR branch is up to date and ready."